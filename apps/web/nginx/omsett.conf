# Reference nginx server block for Omsett. CI serves the built site with exactly this file, so
# what is written here is known to work. For a Laravel Forge site, see docs/deploy-digitalocean.md:
# Forge writes the listen, server_name, and certificate lines itself, and the rest goes inside
# the server block it generates.
#
# OMSETT_ROOT stands for the directory holding `public/` and `headers.nginx`: a release
# published by scripts/publish-static.sh, reached through the `live` link.

server {
    listen 8080;
    server_name _;

    root OMSETT_ROOT/public;
    index index.html;
    charset utf-8;

    # Policies and headers, generated by the build from apps/web/security-headers.ts.
    # Without them the page loads but nothing converts.
    include OMSETT_ROOT/headers.nginx;

    # Compress what compresses. WebAssembly shrinks by more than half.
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # One screen: anything that is not a file is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
