# What the server writes down about each request, for a copy of Omsett that wants a record
# of what was asked of it without a record of who asked.
#
# This goes in nginx's http context: on the server, as /etc/nginx/conf.d/omsett-logging.conf.
# The site's own configuration then names it:
#
#     access_log /var/log/nginx/omsett.com-access.log omsett;
#
# Kept: when, what kind of request, which path, what the answer was, how large, how long it took.
#
# Left out, on purpose:
#   the address it came from      ($remote_addr)
#   the browser and device        ($http_user_agent)
#   the page that linked here     ($http_referer)
#   anything after "?" in a path  ($uri is the path alone; $request_uri would have the rest)
#
# A conversion never appears here: it happens in the browser, and the server is not told.
# What does appear is a page being opened, an engine being fetched (which says roughly what
# kind of conversion somebody was about to make), and a document being sent on to the
# accessibility checker (that it was, never its name or what was in it).
log_format omsett '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';
