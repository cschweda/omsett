name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request replaces the run in progress. On main every push runs to the
# end: a cancelled run there shows on the README's badge as failing, though nothing failed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The work is split so that no one job is long. Each builds the site for itself: a build
  # takes a minute or two, and a job that depends on nothing else starts at once.
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The site states how many tests there are. This fails if that figure is not the real one.
      - run: pnpm exec playwright --version && pnpm tests:count --check
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build

  # Every conversion and every trap file, in each browser. The suite grows with every format,
  # so each browser's share is cut in four, and WebKit's, the slowest, in five; add a part when a job passes ten
  # minutes, in `shard` and in the two places that give the count.
  e2e:
    name: Browser tests (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.browser == 'webkit' && 5 || 4 }})
    runs-on: ubuntu-latest
    # The tests take under ten minutes. Installing WebKit's system packages has taken sixteen
    # on a slow day, and a run that had passed every test was cancelled a second after it finished.
    timeout-minutes: 40
    strategy:
      # One browser failing says nothing about the others; let them all finish.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4, 5]
        # Only WebKit has a fifth part.
        exclude:
          - browser: chromium
            shard: 5
          - browser: firefox
            shard: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.browser == 'webkit' && 5 || 4 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  nginx:
    name: Served by nginx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # The production host is nginx. Serve the same build through the reference config and
      # run the conversion tests against it, so the generated nginx headers are known to work.
      - name: Serve the build with nginx
        run: |
          # Publish five times: the switch to a new release once failed on every publish after
          # the first, and the pruning that followed took the live site down.
          for i in 1 2 3 4 5; do SKIP_BUILD=1 scripts/publish-static.sh "$RUNNER_TEMP/site"; sleep 1; done
          test "$(readlink "$RUNNER_TEMP/site/live")" = "releases/$(ls "$RUNNER_TEMP/site/releases" | sort | tail -1)"
          test "$(ls "$RUNNER_TEMP/site/releases" | wc -l)" -eq 3
          test -f "$RUNNER_TEMP/site/live/public/index.html"
          sed "s#OMSETT_ROOT#/srv/omsett/live#g" apps/web/nginx/omsett.conf > "$RUNNER_TEMP/nginx.conf"
          docker run -d --name nginx -p 8082:8080 \
            -v "$RUNNER_TEMP/site:/srv/omsett:ro" \
            -v "$RUNNER_TEMP/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
          for i in $(seq 1 20); do curl -fsS http://localhost:8082/ > /dev/null && break; sleep 1; done
          curl -fsSI http://localhost:8082/ | grep -qi 'cross-origin-embedder-policy: require-corp'
      # A copy set up to count visits and to check accessibility gets rules for nginx written by
      # the build. nginx itself is asked whether it accepts them, in the reference server block.
      - name: The forwarding rules are ones nginx accepts
        run: |
          node -e "import('./apps/web/security-headers.ts').then((m) => console.log(m.forwardingRules({ visitsSite: 'omsett.com', checker: 'https://audit.icjia.app' })))" > "$RUNNER_TEMP/forwarding.nginx"
          grep -c '^location = ' "$RUNNER_TEMP/forwarding.nginx" | grep -qx 4
          { sed '$d' "$RUNNER_TEMP/nginx.conf"; cat "$RUNNER_TEMP/forwarding.nginx"; echo '}'; } > "$RUNNER_TEMP/nginx-forwarding.conf"
          docker run -d --name nginx-forwarding -p 8083:8080 \
            -v "$RUNNER_TEMP/site:/srv/omsett:ro" \
            -v "$RUNNER_TEMP/nginx-forwarding.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
          for i in $(seq 1 20); do curl -fsS http://localhost:8083/ > /dev/null && break; sleep 1; done
          docker exec nginx-forwarding nginx -t
          # And that they work: a question that changes nothing is asked of the checker through
          # them, and must come back answered. Accepted by nginx and refused at every request
          # is what these rules were, the first time they were deployed.
          curl -fsS --max-time 30 http://localhost:8083/api/accessibility/health | grep -q '"status"' || { docker logs nginx-forwarding 2>&1 | tail -5; exit 1; }
          # The rule for counting takes a POST and nothing else; a GET is turned away by nginx itself.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/api/event)" = "403"
          docker rm -f nginx-forwarding
      - name: Conversion tests against nginx
        run: BASE_URL=http://localhost:8082 pnpm e2e e2e/gate.spec.ts e2e/fixtures.spec.ts e2e/compare.spec.ts --project=chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-nginx
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -f apps/web/Dockerfile -t omsett-web:ci .
      - name: Run as the compose file runs it
        run: |
          docker run -d --name omsett -p 8080:8080 --read-only --cap-drop ALL \
            --tmpfs /data:mode=1777 --tmpfs /config:mode=1777 omsett-web:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ > /dev/null && break; sleep 1; done
      - name: Smoke
        run: |
          set -eux
          test "$(docker inspect -f '{{.Config.User}}' omsett)" = "10001"
          curl -fsS http://localhost:8080/config.json | grep -q '"server":false'
          curl -fsSI http://localhost:8080/ | grep -qi 'cross-origin-embedder-policy: require-corp'
          curl -fsS http://localhost:8080/ | grep -q "connect-src 'self' blob:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = "404"
      - if: always()
        run: docker logs omsett || true

  # One name to look at, and to require: it passes only if everything above did.
  all:
    name: All checks
    if: always()
    needs: [check, e2e, nginx, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do test "$result" = "success"; done
