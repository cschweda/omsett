name: Release

# On a version tag, publish the self-host image. The website is not released from here: the
# server deploys it whenever main changes (see docs/deploy-digitalocean.md).
#
# This job can write packages, so every action is pinned to a full commit SHA; a tag can be
# moved, a SHA cannot. The comment after each SHA is the release it corresponds to.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  checks: read

jobs:
  image:
    name: Push omsett-web to GHCR
    runs-on: ubuntu-latest
    steps:
      # A tag can be put on any commit. Only one whose checks all passed is published.
      - name: Require "All checks" to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/$REPOSITORY/commits/$COMMIT/check-runs" --paginate \
            --jq '[.check_runs[] | select(.name == "All checks" and .conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::\"All checks\" has not passed on $COMMIT. Nothing is published."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The arm64 image is built on an amd64 runner, under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/cschweda/omsett-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
