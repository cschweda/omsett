<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <title>Omsett sample</title>
  <defs>
    <linearGradient id="ramp" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#f4f4f2"/>
    </linearGradient>
  </defs>
  <!-- The left 240 pixels are opaque; the right 80 are left transparent. -->
  <rect width="240" height="200" fill="#f4f4f2"/>
  <rect x="0" y="0" width="80" height="80" fill="#e5342a"/>
  <rect x="80" y="0" width="80" height="80" fill="#2fe38f"/>
  <rect x="160" y="0" width="80" height="80" fill="#3b6cff"/>
  <rect x="0" y="80" width="240" height="40" fill="url(#ramp)"/>
  <circle cx="60" cy="160" r="28" fill="#0d0d0d"/>
  <path d="M120 188 L150 132 L180 188 Z" fill="none" stroke="#0d0d0d" stroke-width="6" stroke-linejoin="miter"/>
  <rect x="200" y="136" width="48" height="48" fill="#3b6cff" fill-opacity="0.5"/>
  <text x="250" y="40" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#3b6cff">omsett</text>
</svg>
