<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omsett og:image source</title>
<!--
  The source of brand/og.png (1200 × 630) and brand/og@2x.png (2400 × 1260).
  Open it in a browser at 1200 × 630, or with ?scale=2 at 2400 × 1260, and capture the viewport.
  It is set in Helvetica Neue, so it must be rendered on a Mac to match the committed files.
-->
<style>
  :root {
    --bg: #0d0d0d;
    --ink: #f4f4f2;
    --muted: #8a8a86;
    --accent: #3b6cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transform-origin: 0 0;
  }

  /* The app's own grid: twelve columns, 48px margins, 24px gutters. */
  .grid {
    position: absolute; inset: 0; padding: 44px 48px 48px;
    display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: auto 1fr auto; column-gap: 24px;
  }
  .rule { position: absolute; left: 48px; right: 400px; top: 84px; height: 1px; background: var(--ink); }

  .promises {
    grid-column: 1 / 9; grid-row: 1;
    display: grid; grid-template-columns: repeat(4, auto); justify-content: start; column-gap: 40px;
    font-size: 19px; font-weight: 500; letter-spacing: -0.005em;
  }

  .mark { grid-column: 1 / 9; grid-row: 2; align-self: center; }
  .wordmark { font-weight: 700; font-size: 236px; line-height: 0.82; letter-spacing: -0.06em; margin-left: -12px; }
  .wordmark .dot { color: var(--accent); }
  .meaning { margin-top: 26px; font-size: 21px; color: var(--muted); }
  .meaning b { color: var(--ink); font-weight: 700; }

  .tagline { grid-column: 1 / 9; grid-row: 3; align-self: end; font-weight: 700; font-size: 34px; line-height: 1.12; letter-spacing: -0.025em; }

  /* The accent block: columns ten to twelve, full height. */
  .block {
    position: absolute; top: 0; right: 0; width: 352px; height: 630px; background: var(--accent); color: #0d0d0d;
    padding: 44px 40px 48px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .pairs { font-weight: 700; font-size: 30px; line-height: 1.28; letter-spacing: -0.03em; }
  .pairs div { display: grid; grid-template-columns: 1fr 34px 1fr; align-items: baseline; }
  .pairs .to { text-align: right; }
  .pairs .arrow { text-align: center; font-weight: 400; }
  .bigarrow { font-weight: 700; font-size: 300px; line-height: 0.7; letter-spacing: -0.08em; margin-left: -12px; margin-bottom: -18px; }
  .domain { font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="grid">
    <div class="promises"><span>Open source</span><span>Free</span><span>Accessible</span><span>Runs in your browser</span></div>
    <div class="mark">
      <div class="wordmark">omsett<span class="dot">.</span></div>
      <div class="meaning"><b>omsett</b>, Norwegian: to translate, to convert</div>
    </div>
    <div class="tagline">Drop a file. Pick a format.<br>Nothing leaves your device.</div>
  </div>
  <div class="block">
    <div class="pairs">
      <div><span>HEIC</span><span class="arrow">→</span><span class="to">JPEG</span></div>
      <div><span>WAV</span><span class="arrow">→</span><span class="to">MP3</span></div>
      <div><span>PDF</span><span class="arrow">→</span><span class="to">DOCX</span></div>
      <div><span>PNG</span><span class="arrow">→</span><span class="to">WebP</span></div>
    </div>
    <div class="bigarrow">→</div>
    <div class="domain">omsett.com</div>
  </div>
  <script>
    // ?scale=2 renders the same picture at twice the size, for the 2× file.
    const scale = Number(new URLSearchParams(location.search).get('scale')) || 1
    document.body.style.transform = `scale(${scale})`
    document.documentElement.style.width = `${1200 * scale}px`
    document.documentElement.style.height = `${630 * scale}px`
  </script>
</body>
</html>
