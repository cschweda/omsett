# Self-hosting Omsett. `docker compose up` serves the app at http://localhost:8080.
#
# Plain HTTP is enough on the machine running Docker, because browsers treat localhost as
# secure. To serve other devices, set OMSETT_SITE_ADDRESS to a hostname and publish 443: off
# localhost, browsers give multi-threaded WASM, offline use, and in-browser video to HTTPS only.
services:
  web:
    image: ghcr.io/cschweda/omsett-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['8080:8080']
    environment:
      OMSETT_SITE_ADDRESS: ':8080' # a hostname here makes Caddy serve HTTPS
      # OMSETT_SERVER: http://omsettd:4310   # Phase 4
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /data:mode=1777 # Caddy's state; nothing else is writable
      - /config:mode=1777

  # Phase 4: native engines for the devices on your network that cannot install the desktop
  # app. Reached only through web's same-origin /api proxy; never published directly.
